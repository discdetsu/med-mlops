# Template: entrypoint.sh replaces __RECEIVER__ with `discord`, `slack`, or `ui-only`, from
# DISCORD_WEBHOOK_URL / SLACK_WEBHOOK_URL in .env (Discord wins when both are set). Without a
# webhook, alerts are only listed at http://localhost:9093.
route:
  receiver: __RECEIVER__
  group_by: [alertname, model_version]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: ui-only

  - name: discord
    discord_configs:
      - webhook_url_file: /tmp/alertmanager/discord_webhook
        send_resolved: true

  - name: slack
    slack_configs:
      - api_url_file: /tmp/alertmanager/slack_webhook
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
