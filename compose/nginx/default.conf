# Gateway: the built Svelte UI at /, the API and admin proxied to Django.
# /internal and /metrics are deliberately not routed: workers and Prometheus reach the
# backend on the compose network only.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Matches MAX_UPLOAD_BYTES in cxr_backend/settings.py.
    client_max_body_size 32m;

    # Docker's DNS, re-resolved so a recreated backend container is found at its new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Backend-only routes; say so instead of falling through to the UI.
    location /internal/ {
        return 404;
    }

    location = /metrics {
        return 404;
    }

    location = /api/jobs {
        limit_req zone=uploads burst=10 nodelay;
        proxy_request_buffering on;
        proxy_pass $backend;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $backend;
    }

    location /admin/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $backend;
    }

    # The admin's CSS/JS, served by WhiteNoise in the backend.
    location /static/ {
        proxy_pass $backend;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        # add_header here drops the server-level ones, so repeat them.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
