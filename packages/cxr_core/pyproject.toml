[project]
name = "cxr-core"
version = "0.1.0"
description = "Shared CXR preprocessing, CAM, and metrics used by both training and serving"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.2",
    "pydicom>=3.0",
    "pillow>=13.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.14",
    "timm>=1.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
