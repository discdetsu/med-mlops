.ns { font-family: var(--mono); font-size: 11.5px; opacity: .85; }
.data rect { fill: var(--data-f); stroke: var(--data-s); } .data text { fill: var(--data-t); }
.train rect { fill: var(--train-f); stroke: var(--train-s); } .train text { fill: var(--train-t); }
.serve rect { fill: var(--serve-f); stroke: var(--serve-s); } .serve text { fill: var(--serve-t); }
.mon rect { fill: var(--mon-f); stroke: var(--mon-s); } .mon text { fill: var(--mon-t); }
.store rect { fill: var(--store-f); stroke: var(--store-s); } .store text { fill: var(--store-t); }
.user rect { fill: var(--surface); stroke: var(--fg); } .user text { fill: var(--fg); }
.core { fill: var(--fg); }
</style>
