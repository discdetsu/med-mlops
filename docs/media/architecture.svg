<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">CXR MLOps architecture</title>
<desc id="d">DVC versions datasets in a RustFS bucket. A new revision with enough new labels triggers a Prefect training flow: validate with a patient-level split, build, train, evaluate on a locked test set, export ONNX, run an end-to-end parity test, build a drift reference from the trained model, and register a challenger with thresholds in MLflow. A promotion gate compares challenger and champion with paired confidence intervals; after approval in Django admin, MLflow moves the champion alias and Django sends the version to workers through RabbitMQ. Workers load that model version from the artifacts bucket. A monitor flow reads predictions and feedback from PostgreSQL plus the champion's reference, pushes scores to Pushgateway and Prometheus, and sends drifted cases and model versus radiologist disagreements to Label Studio. Prometheus also scrapes the API and worker, alerts through Alertmanager, and feeds Grafana.</desc>
