[project]
name = "cxr"
version = "0.1.0"
description = "Lung CXR classification MLOps: shared code for ETL, training, and serving"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cxr"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a running Postgres (set CXR_TEST_DATABASE_URL)",
]
