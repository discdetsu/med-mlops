# Virtual workspace root: no package of its own, only shared tooling config.
[tool.uv.workspace]
members = ["packages/cxr_core", "backend", "worker", "flows"]

[tool.uv.sources]
cxr-core = { workspace = true }
torch = { index = "pytorch-cpu" }
# timm pulls torchvision; a PyPI build doesn't match the CPU torch ABI (torchvision::nms errors).
torchvision = { index = "pytorch-cpu" }

# CPU-only torch wheels: training runs on CPU and CI must not pull CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=2.4",
    "pytest>=9.1",
    "pre-commit>=4",
    "pandas-stubs>=3.0.5.260914",
    "types-pyyaml>=6.0.12.20260906",
    # integration tests against the compose stack
    "boto3>=1.43",
    "mlflow>=3.17",
    "dvc[s3]>=3.67",
    "kombu>=5.6",
    "pytest-django>=4.14",
    "django-stubs>=6.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django declares options (Meta, ModelAdmin, migrations) as mutable class attributes.
"backend/src/cxr_backend/**" = ["RUF012"]
"backend/src/cxr_backend/*/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cxr_core", "cxr_backend", "cxr_worker", "cxr_flows"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "packages/cxr_core/src",
    "backend/src",
    "worker/src",
    "flows/src",
]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "cxr_backend.settings_test"

# Packages that ship neither type hints nor a stubs package; their APIs are typed as Any.
[[tool.mypy.overrides]]
module = [
    "kagglehub", "boto3", "boto3.*", "botocore.*", "onnxruntime", "torchvision", "torchvision.*",
    "celery", "celery.*", "kombu", "kombu.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/cxr_core/tests", "flows/tests", "backend/tests", "worker/tests", "tests"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
DJANGO_SETTINGS_MODULE = "cxr_backend.settings_test"
markers = [
    "integration: needs the core compose stack running (make up)",
]
